name: AVX2 Compiler Matrix

on:
  workflow_call:

jobs:
  avx2-compiler-matrix:
    name: avx2 (${{ matrix.name }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 10 to 14 and Clang 11 to 21 are dropped: this branch needs C++23 and xstd-bits' toolchain rungs.
          - { name: gcc-15, comp: gcc, cxx: g++-15, gcc: "15", gcc_trunk: "false" }
          - { name: gcc-16, comp: gcc, cxx: g++-16, gcc: "16", gcc_trunk: "false" }
          - { name: gcc-17-SVN, comp: gcc, cxx: g++-17, gcc: "17", gcc_trunk: "true" }

          - { name: clang-22, comp: clang, cxx: clang++-22, clang: "22", llvm_suffix: "-22", gcc: "15", gcc_trunk: "false" }
          - { name: clang-23, comp: clang, cxx: clang++-23, clang: "23", llvm_suffix: "-23", gcc: "16", gcc_trunk: "false" }
          - { name: clang-24-SVN, comp: clang, cxx: clang++-24, clang: "24", llvm_suffix: "", gcc: "17", gcc_trunk: "true", cxxflags: "--gcc-toolchain=/opt/gcc-latest" }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      # The libstdc++ of each rung, and its GCC on the GCC legs
      - name: Install GCC ${{ matrix.gcc }}
        uses: rhalbersma/cpp-ci/.github/actions/install-gcc@acbf0f0b3ed85dcabf95cd0d4806c0fa7c451ecf
        with:
          version: ${{ matrix.gcc }}
          trunk: ${{ matrix.gcc_trunk }}
          symlink_binaries: ${{ matrix.comp == 'gcc' }}

      - name: Install Clang ${{ matrix.clang }}
        if: matrix.comp == 'clang'
        uses: rhalbersma/cpp-ci/.github/actions/install-clang@acbf0f0b3ed85dcabf95cd0d4806c0fa7c451ecf
        with:
          version: ${{ matrix.clang }}
          llvm_suffix: ${{ matrix.llvm_suffix }}

      - name: Install Boost headers
        run: |
          .github/ci/install_boost_headers.sh "$RUNNER_TEMP/boost"
          echo "BOOST_INCLUDE=$RUNNER_TEMP/boost" >> $GITHUB_ENV

      - name: Download network
        working-directory: src
        run: make net

      - name: Build avx2 binary
        working-directory: src
        run: |
          export CXXFLAGS="-Werror ${{ matrix.cxxflags }}"
          make clean
          make -j build ARCH=x86-64-avx2 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }}

      - name: Smoke test
        working-directory: src
        run: ./stockfish bench 16 1 6
