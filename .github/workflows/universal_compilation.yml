name: Universal Compilation
on:
  workflow_call:
jobs:
  # Windows arm64 (msys2 Clang) and Linux riscv64 (Clang 20) dropped: this branch needs C++23 and xstd-bits' rungs.
  UniversalLinux:
    name: Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Install GCC 15
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 15

      - name: Install Boost headers
        run: |
          .github/ci/install_boost_headers.sh "$RUNNER_TEMP/boost"
          echo "BOOST_INCLUDE=$RUNNER_TEMP/boost" >> $GITHUB_ENV

      - name: Download SDE package
        uses: petarpetrovt/setup-sde@31aa4a8e85e109bef00f1d838613fcc6ec421271 # v5.0
        with:
          environmentVariableName: SDE_DIR
          sdeVersion: 9.58.0

      - name: Build universal binary
        run: make -j4 -C src ARCH=x86-64-universal profile-build RUN_PREFIX="$SDE_DIR/sde -future --"

      - name: Strip binary
        run: strip src/stockfish

      - name: Rename binary
        run: mv src/stockfish stockfish-linux-x86-64-universal

      - name: Extract the bench number from the commit history
        run: |
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s $hash | tac | grep -m 1 -o -x '[[:space:]]*\b[Bb]ench[ :]\+[1-9][0-9]\{5,7\}\b[[:space:]]*' | sed 's/[^0-9]//g') && break || true
          done
          [[ -n "$benchref" ]] && echo "benchref=$benchref" >> $GITHUB_ENV && echo "From commit: $hash" && echo "Reference bench: $benchref" || echo "No bench found"

      - name: Check arch selection under SDE
        run: ./scripts/check_universal.sh ./stockfish-linux-x86-64-universal "$SDE_DIR/sde" "$benchref"

      - name: Remove non-src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux x86-64-universal
          path: |
             .
             !.git
             !.output

  UniversalWindows:
    name: Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      # WinLibs pins GCC 15, xstd-bits' stable MinGW rung, which msys2's rolling mingw-w64-gcc does not
      - name: Install WinLibs GCC 15
        uses: rhalbersma/cpp-ci/.github/actions/install-winlibs@acbf0f0b3ed85dcabf95cd0d4806c0fa7c451ecf
        with:
          tag_prefix: "15."
          snapshot: "false"
          token: ${{ github.token }}

      - name: Setup msys and install required packages
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          path-type: inherit
          install: make git zip xz

      - name: Install Boost headers
        run: |
          dest="$(cygpath -m "$RUNNER_TEMP")/boost"
          .github/ci/install_boost_headers.sh "$dest"
          echo "BOOST_INCLUDE=$dest" >> $GITHUB_ENV

      - name: Download SDE package
        uses: petarpetrovt/setup-sde@31aa4a8e85e109bef00f1d838613fcc6ec421271 # v5.0
        with:
          environmentVariableName: SDE_DIR
          sdeVersion: 9.58.0

      - name: Build universal binary
        run: |
          SDE_PATH=$(cygpath "$SDE_DIR")
          make -j4 -C src ARCH=x86-64-universal profile-build RUN_PREFIX="$SDE_PATH/sde.exe -future --"

      - name: Strip binary
        run: strip src/stockfish.exe

      - name: Rename binary
        run: mv src/stockfish.exe stockfish-windows-x86-64-universal.exe

      - name: Extract the bench number from the commit history
        run: |
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s $hash | tac | grep -m 1 -o -x '[[:space:]]*\b[Bb]ench[ :]\+[1-9][0-9]\{5,7\}\b[[:space:]]*' | sed 's/[^0-9]//g') && break || true
          done
          [[ -n "$benchref" ]] && echo "benchref=$benchref" >> $GITHUB_ENV && echo "From commit: $hash" && echo "Reference bench: $benchref" || echo "No bench found"

      - name: Check arch selection under SDE
        run: ./scripts/check_universal.sh ./stockfish-windows-x86-64-universal.exe "$SDE_DIR/sde" "$benchref"

      - name: Remove non-src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows x86-64-universal
          path: |
             .
             !.git
             !.output

  UniversalLinuxARM64:
    name: Linux arm64
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Install GCC 15
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 15

      - name: Install Boost headers
        run: |
          .github/ci/install_boost_headers.sh "$RUNNER_TEMP/boost"
          echo "BOOST_INCLUDE=$RUNNER_TEMP/boost" >> $GITHUB_ENV

      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Build universal binary
        run: make -j4 -C src ARCH=arm64-universal profile-build

      - name: Strip binary
        run: strip src/stockfish

      - name: Rename binary
        run: mv src/stockfish stockfish-linux-arm64-universal

      - name: Extract the bench number from the commit history
        run: |
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s $hash | tac | grep -m 1 -o -x '[[:space:]]*\b[Bb]ench[ :]\+[1-9][0-9]\{5,7\}\b[[:space:]]*' | sed 's/[^0-9]//g') && break || true
          done
          [[ -n "$benchref" ]] && echo "benchref=$benchref" >> $GITHUB_ENV && echo "From commit: $hash" && echo "Reference bench: $benchref" || echo "No bench found"

      - name: Check arch selection under qemu
        run: ./scripts/check_universal_arm.sh ./stockfish-linux-arm64-universal "$benchref"

      - name: Remove non-src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux arm64-universal
          path: |
             .
             !.git
             !.output

  UniversalMacOS:
    name: macOS
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      # macos-15 is Apple silicon; Rosetta 2 is needed to exercise the x86-64 slice
      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      # Apple Clang 17 (Xcode 16.4) is xstd-bits' stable Apple Clang rung
      - name: Select Xcode 16.4
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> $GITHUB_ENV

      - name: Install Boost headers
        run: |
          .github/ci/install_boost_headers.sh "$RUNNER_TEMP/boost"
          echo "BOOST_INCLUDE=$RUNNER_TEMP/boost" >> $GITHUB_ENV

      - name: Build universal binary
        run: make -j4 -C src macos-lipo COMP=clang

      - name: Rename binary
        run: mv src/stockfish stockfish-macos-universal

      - name: Verify binary runs natively and under Rosetta
        run: ./scripts/check_universal_macos.sh ./stockfish-macos-universal

      - name: Remove non-src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos universal
          path: |
             .
             !.git
             !.output
